name: نشر التطبيق على فايربيز
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ATALLAM_ENGLISH }}
    steps:
      - uses: actions/checkout@v4
      - name: التأكد من مفتاح فايربيز
        if: env.SA == ''
        run: echo "مفتاح فايربيز لسه مش متضاف للمستودع، فالنشر على فايربيز اتخطى."
      - uses: FirebaseExtended/action-hosting-deploy@v0
        if: env.SA != ''
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ATALLAM_ENGLISH }}
          channelId: live
          projectId: atallam-english
