<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#21508F">
<meta name="description" content="تعلم الإنجليزي بالنطق الأمريكي والبريطاني: كلمات يومية، مراجعة، تمارين، دروس قواعد، ومحادثات.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="أتعلم إنجليزي">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>أتعلم إنجليزي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Readex+Pro:wght@300;400;500;600&family=Baloo+Bhaijaan+2:wght@500;700&display=swap">
<style>
/* Layout: one narrow study column of ruled index cards, stats on top, tab bar pinned to the bottom */
:root{
  --bg:#E9EEF3; --surface:#FFFFFF; --card:#FFFDF8; --ink:#17202F; --muted:#5D6878; --line:#D5DDE7;
  --rule:#BFD3EA; --margin:#D4483C; --accent:#21508F; --accent-ink:#FFFFFF; --soft:#DCE6F2;
  --good:#1E7A4C; --good-bg:#DDF1E5; --bad:#B23A2E; --bad-bg:#F8E1DD;
  --f-ui:"Readex Pro","Segoe UI",Tahoma,sans-serif; --f-en:"Fraunces",Georgia,"Times New Roman",serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10151D; --surface:#18202B; --card:#1C2531; --ink:#E8EDF3; --muted:#9AA6B6; --line:#2C3746;
  --rule:#2A3A50; --margin:#E06A5E; --accent:#7EAAE6; --accent-ink:#0E1520; --soft:#22324A;
  --good:#6CCB98; --good-bg:#173527; --bad:#F08B80; --bad-bg:#3A1F1C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151D; --surface:#18202B; --card:#1C2531; --ink:#E8EDF3; --muted:#9AA6B6; --line:#2C3746;
  --rule:#2A3A50; --margin:#E06A5E; --accent:#7EAAE6; --accent-ink:#0E1520; --soft:#22324A;
  --good:#6CCB98; --good-bg:#173527; --bad:#F08B80; --bad-bg:#3A1F1C; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-ui);font-size:16px;line-height:1.6}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:14px 110px;display:flex;flex-direction:column;gap:16px}
.en{font-family:var(--f-en);direction:ltr;unicode-bidi:isolate}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;flex-direction:column}
.brand b{font-size:1.15rem;font-weight:600}
.brand small{color:var(--muted);font-size:.8rem}
.speed{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.82rem;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center}
.stat b{display:block;font-size:1.3rem;font-weight:600;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.78rem}
button.stat{font:inherit;color:inherit;cursor:pointer}
button.stat:active{background:var(--soft)}
.mw{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.mw:first-child{border-top:0}
.mw .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.mw .t .en{font-family:var(--f-en);direction:ltr;text-align:left;font-weight:650;font-size:1.05rem}
.mw .t .pp{color:var(--margin);font-size:.85rem}
.mw .t small{color:var(--muted)}
.mw .lv{align-self:flex-start;font-size:.72rem;border-radius:999px;padding:1px 8px;white-space:nowrap;background:var(--soft);color:var(--accent)}
.mw .lv.m{background:var(--good-bg);color:var(--good)} .mw .lv.w{background:var(--bad-bg);color:var(--bad)}
.mw .sp{border:1px solid var(--line);background:var(--card);border-radius:50%;width:36px;height:36px;display:grid;place-items:center;flex:none}
.mw .sp svg{width:18px;height:18px}

h2{font-size:1.1rem;font-weight:600;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:.88rem;margin:0}
.head{display:flex;flex-direction:column;gap:2px}

/* index card */
.cardwrap{display:flex;flex-direction:column;gap:12px}
.prog{display:flex;gap:5px}
.prog i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.prog i.on{background:var(--accent)}
.prog i.cur{background:var(--margin)}
.icard{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:0 10px 24px -14px rgba(20,35,60,.35);min-height:300px;padding:44px 22px 22px 22px;overflow:hidden;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,var(--rule) 31px,var(--rule) 32px);
  background-position:0 42px}
.icard::before{content:"";position:absolute;top:0;bottom:0;right:44px;width:2px;background:var(--margin);opacity:.55}
.icard::after{content:"";position:absolute;top:40px;left:0;right:0;height:2px;background:var(--margin);opacity:.35}
.tag{position:absolute;top:10px;right:56px;left:14px;display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted)}
.word{font-family:var(--f-en);font-weight:650;font-size:clamp(2.1rem,9vw,3rem);text-align:center;margin:26px 0 6px;direction:ltr;line-height:1.2;overflow-wrap:anywhere}
.speak{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:.85rem}
.speak svg{width:18px;height:18px}
.center{display:flex;justify-content:center}
.back{margin-top:18px;display:flex;flex-direction:column;gap:10px;text-align:center}
.pron{color:var(--margin);font-size:1.5rem;font-weight:500}
.mean{font-size:1.2rem;font-weight:500}
.ex{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;text-align:start;display:flex;flex-direction:column;gap:4px}
.ex .e{font-family:var(--f-en);direction:ltr;text-align:left;font-size:1.02rem}
.ex .a{color:var(--muted);font-size:.92rem}
.ex .row{display:flex;justify-content:flex-end}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;border-radius:12px;padding:13px 14px;font-weight:500;font-size:1rem}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface);border:1px solid var(--line)}
.btn.good{background:var(--good-bg);color:var(--good)}
.btn.bad{background:var(--bad-bg);color:var(--bad)}
.btn.wide{grid-column:1/-1}

.empty{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:28px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty .big{font-size:2.2rem;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}

/* quiz */
.q{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px 18px;display:flex;flex-direction:column;gap:14px;text-align:center}
.q .prompt{font-size:1.5rem;font-weight:600}
.q .prompt.en{font-size:2rem}
.opts{display:grid;gap:10px}
.opt{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:start;font-size:1rem}
.opt.en{text-align:left;font-size:1.1rem}
.opt.right{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}

/* rules & dictionary */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.panel>summary{list-style:none;padding:14px 16px;font-weight:600;display:flex;justify-content:space-between;gap:10px;cursor:pointer}
.panel>summary::-webkit-details-marker{display:none}
.panel>summary span{color:var(--muted);font-weight:400;font-size:.85rem;white-space:nowrap}
.panel .intro{color:var(--muted);font-size:.88rem;padding:0 16px 8px;margin:0}
.rrow{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;padding:10px 16px;border-top:1px solid var(--line)}
.chip{font-family:var(--f-en);direction:ltr;background:var(--soft);color:var(--accent);border-radius:8px;padding:2px 10px;font-weight:650;font-size:1.05rem;min-width:52px;text-align:center}
.rrow .mid{min-width:0;display:flex;flex-direction:column}
.rrow .mid small{color:var(--muted);font-size:.82rem}
.rrow .mid .en{font-size:1.05rem}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:999px;width:38px;height:38px;display:inline-grid;place-items:center;flex:none}
.iconbtn svg{width:18px;height:18px}

.search{display:flex;flex-direction:column;gap:10px}
.search input{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:12px 14px;font:inherit}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.85rem}
.fchip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.list{display:flex;flex-direction:column}
.drow{display:grid;grid-template-columns:1fr;gap:2px 10px;padding:12px 4px;border-bottom:1px solid var(--line);align-items:center}
.drow .w{display:flex;flex-direction:column;min-width:0}
.drow .w .en{font-size:1.15rem;font-weight:650;display:flex;align-items:center;gap:8px}
.drow .w .p{color:var(--margin)}
.drow .w .m{font-size:.92rem}
.dot{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block}
.more{margin-top:12px}
.prons{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pr{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.pr .lb{font-size:.75rem;color:var(--muted)}
.pr .v{color:var(--margin);font-size:1.25rem;font-weight:500;overflow-wrap:anywhere}
.pr.gb .v{color:var(--accent)}
.pr .speak{padding:4px 10px;font-size:.78rem}
.acc{display:flex;gap:6px;flex-wrap:wrap}
.accb{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 10px;font-size:.75rem;display:inline-flex;align-items:center;gap:4px}
.accb svg{width:14px;height:14px}
.drow .w .g{color:var(--accent)}
.prow{padding:12px 4px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.prow .s{font-family:var(--f-en);direction:ltr;text-align:left;font-size:1.08rem;font-weight:650}
.prow .l{font-size:.9rem;display:flex;gap:6px;flex-wrap:wrap}
.prow .l b{font-weight:400;color:var(--muted);font-size:.78rem}
.prow .l .us{color:var(--margin)} .prow .l .uk{color:var(--accent)}
.prow .m{font-size:.92rem}
.note{color:var(--muted);font-size:.8rem;text-align:center;margin:0}

/* tab bar */
.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:5}
.tabs .in{display:grid;grid-template-columns:repeat(6,1fr);max-width:560px;width:100%}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;color:var(--muted);font-size:.74rem;border-radius:10px;position:relative}
.tab svg{width:22px;height:22px}
.tab[aria-selected="true"]{color:var(--accent);font-weight:600}
.tab .badge{position:absolute;top:2px;left:calc(50% - 20px);background:var(--margin);color:#fff;border-radius:999px;font-size:.65rem;padding:0 5px;line-height:1.4;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:no-preference){.icard,.q{animation:in .25s ease-out}@keyframes in{from{transform:translateY(6px);opacity:.6}to{transform:none;opacity:1}}}
/* hubs & new exercises */
.tabs .in{grid-template-columns:repeat(5,1fr)}
.subbar{display:flex;align-items:center;gap:8px}
.subbar button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.85rem;display:inline-flex;align-items:center;gap:4px}
.subbar span{color:var(--muted);font-size:.85rem}
.hub{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 14px;text-align:start;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile svg{width:26px;height:26px;color:var(--accent)}
.tile b{font-size:1rem;font-weight:600}
.tile small{color:var(--muted);font-size:.8rem;line-height:1.5}
.tile .meta{color:var(--margin);font-size:.75rem}
@media (max-width:360px){.hub{grid-template-columns:1fr}}
.modes{display:flex;gap:6px;flex-wrap:wrap}
.dict-in{width:100%;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:12px 14px;font-family:var(--f-en);font-size:1.25rem;direction:ltr;text-align:left}
.dict-in.ok{border-color:var(--good)} .dict-in.no{border-color:var(--bad)}
.cmp{display:flex;flex-direction:column;gap:4px;text-align:start}
.cmp .row{display:flex;flex-direction:column;gap:2px;background:var(--surface);border-radius:10px;padding:8px 10px;border:1px solid var(--line)}
.cmp .row small{color:var(--muted);font-size:.78rem}
.cmp .row .en{font-size:1.1rem;text-align:left}
.cmp .row .en .x{background:var(--bad-bg);color:var(--bad);border-radius:3px}
.slot{min-height:64px;border:2px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;direction:ltr;align-content:flex-start}
.slot.ok{border-color:var(--good);border-style:solid} .slot.no{border-color:var(--bad);border-style:solid}
.pool{display:flex;flex-wrap:wrap;gap:6px;direction:ltr;justify-content:center}
.wchip{font-family:var(--f-en);border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;font-size:1.05rem}
.slot .wchip{background:var(--soft);border-color:transparent}
.mic{width:84px;height:84px;border-radius:50%;border:0;background:var(--margin);color:#fff;display:grid;place-items:center;margin:0 auto}
.mic svg{width:36px;height:36px}
.mic.on{animation:pulse 1.1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(212,72,60,.45)}100%{box-shadow:0 0 0 18px rgba(212,72,60,0)}}
@media (prefers-reduced-motion:reduce){.mic.on{animation:none;outline:4px solid var(--margin)}}
.verdict{border-radius:12px;padding:10px 12px;font-weight:500}
.verdict.ok{background:var(--good-bg);color:var(--good)} .verdict.mid{background:var(--soft);color:var(--accent)} .verdict.no{background:var(--bad-bg);color:var(--bad)}
.heard{font-family:var(--f-en);direction:ltr;font-size:1.05rem}
/* lessons */
.lrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-top:1px solid var(--line);background:none;border-inline:0;border-bottom:0;width:100%;text-align:start}
.lrow:first-child{border-top:0}
.lrow .num{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.85rem;min-width:22px}
.lrow .tt{flex:1;min-width:0;font-weight:500}
.lrow .sc{font-size:.78rem;border-radius:999px;padding:1px 9px;background:var(--soft);color:var(--accent);white-space:nowrap}
.lrow .sc.full{background:var(--good-bg);color:var(--good)}
.lesson{display:flex;flex-direction:column;gap:14px}
.story{display:flex;flex-direction:column;gap:12px}
.lvh{margin:6px 0 0;font-size:1rem;color:var(--muted);font-weight:600}
.sen{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.sen.playing{border-color:var(--accent);box-shadow:0 0 0 2px var(--soft)}
.sen .en{font-family:var(--f-en);direction:ltr;text-align:left;font-size:1.12rem;line-height:1.9}
.sen .us{color:var(--margin);font-size:.9rem} .sen .a{font-size:.95rem}
.tw{cursor:pointer;border-bottom:1px dotted var(--muted);padding:0 1px}
.tw:active{background:var(--soft)}
.lq .qa{font-weight:500} .lq .os.ar{direction:rtl}
.wpop{position:fixed;inset:0;z-index:25;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;justify-content:center}
.wpop .in{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.wpop .en{font-family:var(--f-en);direction:ltr;text-align:left;font-size:1.6rem}
.wpop .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.wpop .btn svg{width:18px;height:18px;flex:none}
.wpop .mean{font-size:1.15rem} .wpop .pp{color:var(--margin)} .wpop .pp.gb{color:var(--accent)}
.tipbar{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--soft);border-radius:12px;padding:10px 12px;font-size:.92rem}
.gcode{font-family:var(--f-en);letter-spacing:.15em;font-size:1.2rem;direction:ltr}
.brow .av{font-size:1.4rem} .brow.me{background:var(--soft)}
.lesson p{margin:0;line-height:1.8}
.pats{display:flex;flex-direction:column;gap:6px}
.pat{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.pat .en{font-weight:650;font-size:1.08rem}
.pat small{color:var(--muted)}
.exl{display:flex;flex-direction:column;gap:8px}
.exi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.exi .en{text-align:left;font-size:1.05rem;font-weight:650}
.exi .us{color:var(--margin);font-size:.9rem} .exi .uk{color:var(--accent);font-size:.9rem}
.exi .a{color:var(--muted);font-size:.9rem}
.lq{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.lq .s{font-family:var(--f-en);direction:ltr;text-align:left;font-size:1.12rem}
.lq .s u{text-decoration:none;border-bottom:2px solid var(--accent);padding:0 6px;color:var(--accent);font-weight:650}
.lq .os{display:flex;gap:6px;flex-wrap:wrap;direction:ltr}
.lq .o{font-family:var(--f-en);border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 14px;font-size:1rem}
.lq .o.right{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.lq .o.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.lq .h{color:var(--muted);font-size:.88rem}
/* conversations */
.chat{display:flex;flex-direction:column;gap:10px}
.bub{max-width:88%;border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;border:1px solid var(--line)}
.bub.r0{align-self:flex-start;background:var(--surface);border-start-start-radius:4px}
.bub.r1{align-self:flex-end;background:var(--soft);border-start-end-radius:4px}
.bub .who{font-size:.75rem;color:var(--muted)}
.bub .en{text-align:left;font-size:1.04rem;font-weight:650}
.bub .us{color:var(--margin);font-size:.86rem} .bub .uk{color:var(--accent);font-size:.86rem}
.bub .a{font-size:.9rem}
.bub.hide .en,.bub.hide .us,.bub.hide .uk{filter:blur(6px);user-select:none}
.bub.playing{outline:2px solid var(--margin)}
.row2{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.minib{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 10px;font-size:.75rem}
/* family profiles & kids */
:root{--sun:#F2B705;--sun-ink:#4A3500;--sky:#DDEBFA;--f-kid:"Baloo Bhaijaan 2","Readex Pro",Tahoma,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sun:#F5C842;--sun-ink:#2A1F00;--sky:#1D2C40}}
:root[data-theme="dark"]{--sun:#F5C842;--sun-ink:#2A1F00;--sky:#1D2C40}
.avbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:1.35rem;display:grid;place-items:center;flex:none}
.picker{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px))}
.picker .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.picker h1{font-family:var(--f-kid);font-size:1.6rem;margin:0;text-align:center}
.pgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.pcard{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0}
.pcard .av{font-size:3rem;line-height:1.1}
.pcard b{font-size:1.1rem}
.pcard small{color:var(--muted);font-size:.78rem}
.pcard .st{font-size:.82rem;color:var(--accent)}
.pcard.add{border-style:dashed;color:var(--muted);justify-content:center}
.pcard .del{position:absolute;top:6px;left:6px;border:0;background:var(--bad-bg);color:var(--bad);border-radius:999px;font-size:.72rem;padding:2px 8px}
.pform{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.pform input{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 14px;font:inherit}
.avs{display:flex;flex-wrap:wrap;gap:8px}
.avs button{font-size:1.6rem;width:48px;height:48px;border-radius:12px;border:2px solid var(--line);background:var(--card)}
.avs button[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.types{display:grid;gap:8px}
.types button{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;text-align:start;display:flex;flex-direction:column}
.types button small{color:var(--muted)}
.types button[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}

/* kids shell */
.kid{font-family:var(--f-kid);max-width:600px;margin:0 auto;padding-inline:16px;padding-block:14px 40px;display:flex;flex-direction:column;gap:16px}
.khead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.khead .hi{display:flex;align-items:center;gap:10px;min-width:0}
.khead .hi b{font-size:1.3rem;line-height:1.2}
.stars{display:inline-flex;align-items:center;gap:6px;background:var(--sun);color:var(--sun-ink);border:0;border-radius:999px;padding:6px 14px;font-weight:700;font-size:1.15rem;font-variant-numeric:tabular-nums}
.ktopics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:420px){.ktopics{grid-template-columns:repeat(2,1fr)}}
.ktile{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--f-kid);min-width:0}
.ktile .em{font-size:2.6rem;line-height:1.2}
.ktile b{font-size:1.05rem;font-weight:700}
.ktile small{color:var(--muted);font-size:.8rem}
.ktile.done{border-color:var(--sun);background:var(--sky)}
.kbig{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kbtn{border:0;border-radius:22px;padding:22px 10px;font-family:var(--f-kid);font-size:1.3rem;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:6px}
.kbtn .em{font-size:2.6rem;line-height:1}
.kbtn.a{background:var(--accent);color:var(--accent-ink)}
.kbtn.b{background:var(--sun);color:var(--sun-ink)}
.kbtn.c{background:var(--surface);border:2px solid var(--line)}
.kback{align-self:flex-start;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-family:var(--f-kid);font-size:1rem}
.kcard{background:var(--card);border:2px solid var(--line);border-radius:28px;padding:24px 16px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.kcard .pic{font-size:clamp(5rem,28vw,8rem);line-height:1.1}
.kcard .letter{font-family:var(--f-en);font-weight:650;font-size:3.6rem;color:var(--accent);direction:ltr}
.kcard .w{font-family:var(--f-en);font-weight:650;font-size:clamp(2rem,9vw,2.8rem);direction:ltr}
.kcard .pp{color:var(--margin);font-size:1.3rem}
.kcard .m{font-size:1.2rem}
.ksay{width:76px;height:76px;border-radius:50%;border:0;background:var(--sun);color:var(--sun-ink);display:grid;place-items:center}
.ksay svg{width:38px;height:38px}
.knav{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.knav button.arr{border:0;border-radius:18px;background:var(--accent);color:var(--accent-ink);font-size:1.6rem;padding:12px;font-family:var(--f-kid)}
.knav button.arr:disabled{opacity:.35}
.dots{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)} .dots i.on{background:var(--sun)}
.kopts{display:grid;gap:12px}
.kopts.c3{grid-template-columns:repeat(3,1fr)} .kopts.c4{grid-template-columns:repeat(2,1fr)}
.kopt{background:var(--surface);border:3px solid var(--line);border-radius:22px;padding:14px 6px;font-size:clamp(3rem,16vw,4.2rem);line-height:1.15;display:flex;flex-direction:column;align-items:center;gap:2px}
.kopt small{font-family:var(--f-en);font-size:1rem;direction:ltr}
.kopt.right{border-color:var(--good);background:var(--good-bg)}
.kopt.wrong{border-color:var(--bad);animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mem.m4{grid-template-columns:repeat(4,1fr)}
@media (max-width:420px){.mem.m4{grid-template-columns:repeat(3,1fr)}}
.mc{aspect-ratio:3/4;max-width:100%;border-radius:16px;border:0;background:var(--accent);color:var(--accent-ink);font-size:2.4rem;display:grid;place-items:center;font-family:var(--f-kid)}
.mc.open{background:var(--card);border:2px solid var(--line);color:var(--ink)}
.mc.got{background:var(--good-bg);border:2px solid var(--good);color:var(--ink)}
.mc .wd{font-family:var(--f-en);font-size:1.05rem;font-weight:650;direction:ltr;padding:2px;overflow-wrap:anywhere}
.spell{display:flex;gap:6px;justify-content:center;direction:ltr;flex-wrap:wrap}
.spell .slot1{width:44px;height:52px;border-radius:12px;border:2px dashed var(--line);display:grid;place-items:center;font-family:var(--f-en);font-size:1.6rem;font-weight:650}
.spell .slot1.f{border-style:solid;border-color:var(--accent);background:var(--soft)}
.tiles{display:flex;gap:8px;justify-content:center;direction:ltr;flex-wrap:wrap}
.tiles button{width:48px;height:52px;border-radius:12px;border:0;background:var(--sun);color:var(--sun-ink);font-family:var(--f-en);font-size:1.6rem;font-weight:650}
.tiles button:disabled{opacity:.25}
.kmsg{font-size:1.4rem;font-weight:700;text-align:center;min-height:2rem}
.kmsg.ok{color:var(--good)} .kmsg.no{color:var(--bad)}
.btoast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:.95rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:40;max-width:calc(100% - 32px);text-align:center}
.btoast.on{opacity:1;transform:translate(-50%,0)}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.badge1{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;font-size:2rem}
.badge1 small{font-size:.72rem;color:var(--muted);text-align:center}
.badge1.lock{filter:grayscale(1);opacity:.35}
.burst{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.burst i{position:absolute;font-style:normal;font-size:2rem;animation:fly 1.1s ease-out forwards}
@keyframes fly{from{transform:translate(0,0) scale(.6);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(1.2);opacity:0}}
@media (prefers-reduced-motion:reduce){.burst{display:none}.kopt.wrong{animation:none}}

/* progress */
.prog7{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:150px;padding:8px 4px 0;border-bottom:1px solid var(--line)}
.prog7 .bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.prog7 .bar i{width:70%;max-width:34px;border-radius:6px 6px 0 0;background:var(--accent);min-height:2px}
.prog7 .bar.today i{background:var(--margin)}
.prog7 .bar span{font-size:.75rem;font-variant-numeric:tabular-nums}
.prog7l{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:.72rem;color:var(--muted)}
.goalbar{height:12px;border-radius:999px;background:var(--line);overflow:hidden}
.goalbar i{display:block;height:100%;background:var(--good);border-radius:999px}
.tot{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
</style>

<script>
(function(){
const D=JSON.parse(document.getElementById('data').textContent);
const W=D.words, S=D.sections, R=D.rules;
const AR='٠١٢٣٤٥٦٧٨٩'; const n=x=>String(x).replace(/\d/g,d=>AR[d]);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const INTERVALS=[0,1,3,7,14,30,60];
const PER_DAY=10;
const today=()=>{const d=new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/86400000)};
const SPK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
const PART=['','الجزء الأول','الجزء الثاني','الجزء الثالث','الجزء الرابع'];

/* ---------- family profiles ---------- */
const PKEY='eng-profiles';
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}};
let PROFILES=lsGet(PKEY,null);
if(!Array.isArray(PROFILES)||!PROFILES.length) PROFILES=[{id:'me',name:'أنا',type:'adult',av:'🧑'}];
const saveProfiles=()=>{lsSet(PKEY,PROFILES); if(window.__onProfiles) window.__onProfiles(PROFILES);};
const TYPES={adult:{t:'كبير',d:'الكلمات والتمارين والدروس كاملة'},kidBig:{t:'طفل بيقرا',d:'من ٧ سنين وأكبر: صور وكلمات وتهجي'},kidSmall:{t:'طفل صغير',d:'أقل من ٧ سنين: صور وصوت من غير قراية'}};
const AVS=['🧑','👩','👨','👦','👧','🧒','👶','🦁','🐼','🐱','🦊','🐸','🐯','🚀','⚽','🌟'];
const profKey=p=>p.type==='adult'?(p.id==='me'?'eng-cards-v1':'eng-cards-v1:'+p.id):'eng-kid:'+p.id;
function profStat(p){
  const s=lsGet(profKey(p),{});
  if(p.type==='adult'){ const n1=Object.values(s.p||{}).filter(v=>v[0]>0).length; return n(n1)+' كلمة محفوظة'; }
  return n(s.stars||0)+' نجمة · '+n(Object.keys(s.badges||{}).length)+' شارة';
}
let activeId=null; try{activeId=sessionStorage.getItem('eng-active');}catch(e){}
if(!PROFILES.find(p=>p.id===activeId)) activeId=PROFILES.length===1?PROFILES[0].id:null;
function choose(id){ try{sessionStorage.setItem('eng-active',id); sessionStorage.removeItem('eng-tab');}catch(e){} location.reload(); }
function openPicker(){
  let el=document.getElementById('picker'); if(!el){el=document.createElement('div');el.id='picker';el.className='picker';el.dir='rtl';document.body.appendChild(el);}
  let mode='list', form={name:'',type:'kidSmall',av:'👦'}, delArm=null;
  const paint=()=>{
    if(mode==='list'){
      el.innerHTML=`<div class="in"><h1>مين هيتعلم دلوقتي؟</h1>
      <div class="pgrid">${PROFILES.map(p=>`<div class="pcard"><button type="button" class="kback" style="all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;width:100%" data-pick="${p.id}"><span class="av">${p.av}</span><b>${esc(p.name)}</b><small>${TYPES[p.type].t}</small><span class="st">${profStat(p)}</span></button>${p.id!=='me'?`<button class="del" type="button" data-del="${p.id}">${delArm===p.id?'متأكد؟ احذف':'حذف'}</button>`:''}</div>`).join('')}
        <button class="pcard add" type="button" id="padd"><span class="av">＋</span><b>حساب جديد</b><small>لطفل أو لحد من العيلة</small></button></div>
      ${activeId?'<button class="btn ghost" type="button" id="pclose">رجوع</button>':''}</div>`;
      el.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>choose(b.dataset.pick));
      el.querySelectorAll('[data-del]').forEach(b=>b.onclick=e=>{e.stopPropagation(); const id=b.dataset.del; if(delArm!==id){delArm=id;paint();return;}
        PROFILES=PROFILES.filter(p=>p.id!==id); saveProfiles(); try{localStorage.removeItem('eng-kid:'+id);localStorage.removeItem('eng-cards-v1:'+id);}catch(e){} delArm=null; if(activeId===id){try{sessionStorage.removeItem('eng-active')}catch(e){} location.reload();return;} paint();});
      el.querySelector('#padd').onclick=()=>{mode='add';paint();};
      const c=el.querySelector('#pclose'); if(c) c.onclick=()=>{el.remove();};
    } else {
      el.innerHTML=`<div class="in"><h1>حساب جديد</h1><div class="pform">
        <label for="pname">الاسم</label><input id="pname" type="text" maxlength="20" placeholder="مثلًا: يوسف" value="${esc(form.name)}">
        <span>نوع الحساب</span><div class="types">${Object.entries(TYPES).map(([k,v])=>`<button type="button" data-type="${k}" aria-pressed="${form.type===k}"><b>${v.t}</b><small>${v.d}</small></button>`).join('')}</div>
        <span>اختار صورة</span><div class="avs">${AVS.map(a=>`<button type="button" data-av="${a}" aria-pressed="${form.av===a}">${a}</button>`).join('')}</div>
        <div class="actions"><button class="btn ghost" type="button" id="pcancel">إلغاء</button><button class="btn primary" type="button" id="psave">حفظ</button></div></div></div>`;
      const nm=el.querySelector('#pname'); nm.oninput=()=>form.name=nm.value;
      el.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{form.type=b.dataset.type;paint();});
      el.querySelectorAll('[data-av]').forEach(b=>b.onclick=()=>{form.av=b.dataset.av;paint();});
      el.querySelector('#pcancel').onclick=()=>{mode='list';paint();};
      el.querySelector('#psave').onclick=()=>{ const name=(form.name||'').trim(); if(!name){nm.focus();nm.placeholder='اكتب الاسم الأول';return;}
        PROFILES.push({id:'p'+Date.now().toString(36),name,type:form.type,av:form.av}); saveProfiles(); form={name:'',type:'kidSmall',av:'👦'}; mode='list'; paint(); };
    }
  };
  el._back=()=>mode==='add'?()=>{mode='list';paint();}:(activeId?()=>el.remove():null);
  paint();
}

/* ---------- phone back button ---------- */
let backFn=()=>null;
function toastMsg(t){ let d=document.getElementById('btoast'); if(!d){d=document.createElement('div');d.id='btoast';d.className='btoast';d.setAttribute('role','status');document.body.appendChild(d);} d.textContent=t; d.classList.add('on'); clearTimeout(d._t); d._t=setTimeout(()=>d.classList.remove('on'),1800); }
(function(){
  try{ history.replaceState({r:1},''); history.pushState({g:1},''); }catch(e){ return; }
  let armed=0;
  window.addEventListener('popstate',()=>{
    const pk=document.getElementById('picker');
    const act=pk&&pk._back?pk._back():backFn();
    if(act){ try{act();}catch(e){} history.pushState({g:1},''); return; }
    if(Date.now()-armed<2000){ history.back(); return; }
    armed=Date.now(); toastMsg('اضغط رجوع تاني عشان تقفل التطبيق'); history.pushState({g:1},'');
  });
})();

/* ---------- kids ---------- */
function startKid(ME){
  document.getElementById('app').hidden=true; document.querySelector('.tabs').hidden=true;
  const K=D.kids, small=ME.type==='kidSmall', SKEY=profKey(ME);
  let ks=Object.assign({stars:0,seen:{},best:{},badges:{}},lsGet(SKEY,{}));
  const ksave=()=>{ks.ts=Date.now(); lsSet(SKEY,ks); if(window.__onKidSave) window.__onKidSave(SKEY,ks);};
  const root=document.getElementById('kid'); root.hidden=false;
  const synth=window.speechSynthesis; let v=null;
  const pick=()=>{ if(!synth) return; const vs=synth.getVoices(); v=vs.find(x=>(x.lang||'').replace('_','-')==='en-US'&&/Samantha|Google US|Aria|Jenny|Ava/i.test(x.name))||vs.find(x=>(x.lang||'').replace('_','-')==='en-US')||null; };
  if(synth){pick(); synth.addEventListener&&synth.addEventListener('voiceschanged',pick);}
  const say=(t,rate)=>{ if(!synth) return; try{synth.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang='en-US'; if(v) u.voice=v; u.rate=rate||(small?0.75:0.85); synth.speak(u);}catch(e){} };
  const SAYIC='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
  const shuffle=a=>{for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};
  const PRAISE=['Great job!','Well done!','Super!','Amazing!','Good job!'];
  function burst(){ if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches) return; const b=document.createElement('div'); b.className='burst';
    for(let k=0;k<14;k++){const i=document.createElement('i'); i.textContent=['⭐','🌟','✨'][k%3]; i.style.left='50%'; i.style.top='45%'; i.style.setProperty('--dx',(Math.random()*300-150)+'px'); i.style.setProperty('--dy',(Math.random()*-300+40)+'px'); b.appendChild(i);}
    document.body.appendChild(b); setTimeout(()=>b.remove(),1200); }
  function addStars(k){ ks.stars+=k; const w=Math.floor((today()-3)/7); if(!ks.pts||ks.pts.wk!==w) ks.pts={wk:w,v:0}; ks.pts.v+=k; ksave(); const s=document.getElementById('kstars'); if(s) s.textContent=n(ks.stars); }
  const head=()=>`<div class="khead"><div class="hi"><button class="avbtn" type="button" id="kswitch" aria-label="تغيير المستخدم">${ME.av}</button><b>أهلًا يا ${esc(ME.name)}</b></div><button class="stars" type="button" id="kstarsb">⭐ <span id="kstars">${n(ks.stars)}</span></button></div>`;
  const wire=()=>{ root.querySelector('#kswitch').onclick=openPicker; root.querySelector('#kstarsb').onclick=showBadges; const b=root.querySelector('#kback'); if(b) b.onclick=b._go; };
  let curBack=null; backFn=()=>curBack;
  function render(html,back){ curBack=back||null; if(synth) synth.cancel(); root.innerHTML=head()+(back?`<button class="kback" type="button" id="kback">→ رجوع</button>`:'')+html; if(back) root.querySelector('#kback')._go=back; wire(); window.scrollTo(0,0); }
  function home(){
    render(`<div class="ktopics">${K.map((t,i)=>{const seen=(ks.seen[i]||[]).length; return `<button class="ktile ${ks.badges[i]?'done':''}" type="button" data-t="${i}"><span class="em">${t.e}</span><b>${esc(t.t)}</b><small>${ks.badges[i]?'🏅 ':''}${n(seen)} من ${n(t.items.length)}</small></button>`}).join('')}</div>`);
    root.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>topic(+b.dataset.t));
  }
  function topic(ti){
    const t=K[ti];
    const games=small?[['tap','👂','اسمع واختار'],['mem','🃏','الذاكرة']]:[['tap','👂','اسمع واختار'],['mem','🃏','الذاكرة'],['spell','✍️','اكتب الكلمة'],['speak','🎤','قول الكلمة']];
    render(`<div class="kcard"><span class="pic" style="font-size:4rem">${t.e}</span><b style="font-size:1.6rem">${esc(t.t)}</b></div>
      <div class="kbig"><button class="kbtn a" type="button" id="klearn"><span class="em">📖</span>اتعلم</button>${games.map(g=>`<button class="kbtn ${g[0]==='tap'?'b':'c'}" type="button" data-g="${g[0]}"><span class="em">${g[1]}</span>${g[2]}</button>`).join('')}</div>`,home);
    root.querySelector('#klearn').onclick=()=>learn(ti,0);
    root.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>({tap:gTap,mem:gMem,spell:gSpell,speak:gSpeak})[b.dataset.g](ti));
  }
  function learn(ti,k){
    const t=K[ti], it=t.items[k]; const seen=ks.seen[ti]||(ks.seen[ti]=[]);
    if(!seen.includes(k)){ seen.push(k); addStars(1); }
    render(`<div class="dots">${t.items.map((_,j)=>`<i class="${j<=k?'on':''}"></i>`).join('')}</div>
      <div class="kcard">${t.letters?`<span class="letter">${esc(it[5])} ${esc(it[5].toLowerCase())}</span>`:''}<span class="pic">${it[1]}</span><span class="w" lang="en">${esc(it[0])}</span>
      ${small?`<span class="m">${esc(it[2])}</span>`:`<span class="pp">${esc(it[3])}</span><span class="m">${esc(it[2])}</span>`}</div>
      <div class="knav"><button class="arr" type="button" id="kprev" ${k===0?'disabled':''} aria-label="اللي فات">→</button><button class="ksay" type="button" id="ksay" aria-label="اسمع">${SAYIC}</button><button class="arr" type="button" id="knext" aria-label="اللي بعده">${k===t.items.length-1?'✓':'←'}</button></div>`,()=>topic(ti));
    const sp=()=>t.letters?say(it[5]+'. '+it[0]):say(it[0]);
    root.querySelector('#ksay').onclick=sp; setTimeout(sp,250);
    root.querySelector('#kprev').onclick=()=>learn(ti,k-1);
    root.querySelector('#knext').onclick=()=>{ if(k<t.items.length-1) learn(ti,k+1); else done(ti,null,'خلصت كل كلمات الموضوع! يلا نلعب'); };
  }
  function done(ti,score,msg){
    let badge=false;
    if(score){ const pct=score[0]/score[1]; ks.best[ti]=Math.max(ks.best[ti]||0,score[0]); if(pct>=0.8&&!ks.badges[ti]){ks.badges[ti]=true;badge=true;} ksave(); }
    render(`<div class="kcard"><span class="pic">${badge?'🏅':'🎉'}</span>${score?`<b style="font-size:2rem">${n(score[0])} من ${n(score[1])}</b>`:''}<b style="font-size:1.4rem">${badge?'شارة جديدة! برافو عليك':msg||'برافو!'}</b></div>
      <div class="kbig"><button class="kbtn b" type="button" id="kagain">🔁 تاني</button><button class="kbtn a" type="button" id="khome">🏠 الرئيسية</button></div>`,()=>topic(ti));
    burst(); say(badge?'You got a badge! Amazing!':'Well done!');
    root.querySelector('#kagain').onclick=()=>topic(ti); root.querySelector('#khome').onclick=home;
  }
  /* game: listen and tap */
  function gTap(ti){
    const t=K[ti], N=small?3:4, rounds=Math.min(6,t.items.length); const order=shuffle(t.items.map((_,j)=>j)).slice(0,rounds); let r=0, score=0, miss=false;
    const q=()=>{ if(r>=rounds) return done(ti,[score,rounds]);
      const ans=order[r]; const opts=shuffle([ans,...shuffle(t.items.map((_,j)=>j).filter(j=>j!==ans)).slice(0,N-1)]); miss=false;
      render(`<div class="dots">${order.map((_,j)=>`<i class="${j<r?'on':''}"></i>`).join('')}</div><div class="center"><button class="ksay" type="button" id="ksay" aria-label="اسمع تاني">${SAYIC}</button></div>
        <div class="kmsg" id="kmsg">${small?'اسمع ودوس على الصورة':'اسمع واختار الصورة الصح'}</div>
        <div class="kopts ${N===3?'c3':'c4'}">${opts.map(o=>`<button class="kopt" type="button" data-o="${o}">${t.items[o][1]}</button>`).join('')}</div>`,()=>topic(ti));
      const w=t.items[ans][0]; root.querySelector('#ksay').onclick=()=>say(w); setTimeout(()=>say(w),300);
      root.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{ const o=+b.dataset.o; const m=root.querySelector('#kmsg');
        if(o===ans){ b.classList.add('right'); if(!miss){score++;addStars(1);} burst(); m.className='kmsg ok'; m.textContent='برافو!'; say(PRAISE[r%PRAISE.length]); root.querySelectorAll('[data-o]').forEach(x=>x.disabled=true); setTimeout(()=>{r++;q();},1300); }
        else { miss=true; b.classList.remove('wrong'); void b.offsetWidth; b.classList.add('wrong'); m.className='kmsg no'; m.textContent='حاول تاني'; setTimeout(()=>say(w),400); } });
    }; q();
  }
  /* game: memory */
  function gMem(ti){
    const t=K[ti], P=small?3:4; const pick=shuffle(t.items.map((_,j)=>j)).slice(0,Math.min(P,t.items.length));
    const cards=shuffle(pick.flatMap(j=>[{j,k:'p'},{j,k:small?'p':'w'}])).map((c,i)=>({...c,i,open:false,got:false}));
    let first=null, lock=false, tries=0;
    const paint=()=>{ render(`<div class="kmsg">${small?'لاقي الصور اللي شبه بعض':'وصّل كل كلمة بصورتها'}</div><div class="mem ${cards.length>6?'m4':''}">${cards.map(c=>`<button class="mc ${c.got?'got':c.open?'open':''}" type="button" data-c="${c.i}" ${c.got?'disabled':''}>${c.open||c.got?(c.k==='p'?t.items[c.j][1]:`<span class="wd">${esc(t.items[c.j][0])}</span>`):'?'}</button>`).join('')}</div>`,()=>topic(ti));
      root.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>flip(+b.dataset.c)); };
    const flip=i=>{ const c=cards[i]; if(lock||c.open||c.got) return; c.open=true; say(t.items[c.j][0]);
      if(!first){first=c;paint();return;}
      tries++; const a=first; first=null; paint();
      if(a.j===c.j){ a.got=c.got=true; a.open=c.open=false; addStars(1); burst(); setTimeout(()=>{ paint(); if(cards.every(x=>x.got)) done(ti,[pick.length,Math.max(tries,pick.length)]); },500); }
      else { lock=true; setTimeout(()=>{a.open=c.open=false;lock=false;paint();},900); } };
    paint();
  }
  /* game: spell (big kids) */
  function gSpell(ti){
    const t=K[ti]; const pool=t.items.map((_,j)=>j).filter(j=>/^[a-z]{2,7}$/i.test(t.items[j][0]));
    const order=shuffle(pool).slice(0,Math.min(5,pool.length)); let r=0, score=0;
    const q=()=>{ if(r>=order.length) return done(ti,[score,order.length]);
      const it=t.items[order[r]], word=it[0].toLowerCase(); const tiles=shuffle(word.split('').map((ch,k)=>({ch,k}))); let got=[], miss=false;
      const paint=(msg,cls)=>{ render(`<div class="kcard"><span class="pic" style="font-size:4.5rem">${it[1]}</span><span class="m">${esc(it[2])}</span><button class="ksay" type="button" id="ksay" aria-label="اسمع">${SAYIC}</button></div>
        <div class="spell">${word.split('').map((_,k)=>`<span class="slot1 ${got[k]!=null?'f':''}">${got[k]!=null?esc(tiles[got[k]].ch):''}</span>`).join('')}</div>
        <div class="kmsg ${cls||''}">${msg||'رتب الحروف'}</div>
        <div class="tiles">${tiles.map((tl,k)=>`<button type="button" data-k="${k}" ${got.includes(k)?'disabled':''}>${esc(tl.ch)}</button>`).join('')}</div>
        ${got.length?'<div class="center"><button class="kback" type="button" id="kundo">امسح آخر حرف</button></div>':''}`,()=>topic(ti));
        root.querySelector('#ksay').onclick=()=>say(it[0]);
        root.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{ got.push(+b.dataset.k); say(tiles[+b.dataset.k].ch,0.9);
          if(got.length===word.length){ const ok=got.map(k=>tiles[k].ch).join('')===word;
            if(ok){ if(!miss){score++;addStars(2);} burst(); say(PRAISE[r%PRAISE.length]); paint('برافو! '+it[0],'ok'); setTimeout(()=>{r++;q();},1400); }
            else { miss=true; got=[]; paint('قربت! حاول تاني','no'); setTimeout(()=>say(it[0]),300); } }
          else paint(); });
        const u=root.querySelector('#kundo'); if(u) u.onclick=()=>{got.pop();paint();}; };
      paint(); setTimeout(()=>say(it[0]),300);
    }; q();
  }
  /* game: speak (big kids) */
  function gSpeak(ti){
    const t=K[ti]; const SRc=window.SpeechRecognition||window.webkitSpeechRecognition; const order=shuffle(t.items.map((_,j)=>j)).slice(0,Math.min(5,t.items.length)); let r=0, score=0;
    const q=(msg,cls)=>{ if(r>=order.length) return done(ti,[score,order.length]); const it=t.items[order[r]];
      render(`<div class="kcard"><span class="pic">${it[1]}</span><span class="w" lang="en">${esc(it[0])}</span><span class="pp">${esc(it[3])}</span></div>
        <div class="kmsg ${cls||''}">${msg||'اسمع وبعدين دوس على المايك وقول الكلمة'}</div>
        <div class="kbig"><button class="kbtn c" type="button" id="ksay"><span class="em">🔊</span>اسمع</button><button class="kbtn b" type="button" id="kmic"><span class="em">🎤</span>قول</button></div>
        <div class="center"><button class="kback" type="button" id="kskip">الكلمة اللي بعدها</button></div>`,()=>topic(ti));
      root.querySelector('#ksay').onclick=()=>say(it[0]);
      root.querySelector('#kskip').onclick=()=>{r++;q();};
      root.querySelector('#kmic').onclick=()=>{ if(!SRc) return q('المايك مش شغال في المتصفح ده. افتح التطبيق من كروم.','no');
        try{ if(synth) synth.cancel(); const rec=new SRc(); rec.lang='en-US'; rec.maxAlternatives=5; let got=false; root.querySelector('#kmic').innerHTML='<span class="em">👂</span>بسمعك...';
          rec.onresult=e=>{got=true; const alts=Array.from(e.results[0]).map(a=>a.transcript.toLowerCase().trim()); const w=it[0].toLowerCase();
            if(alts.some(a=>a.replace(/[^a-z ]/g,'').trim()===w||a.includes(w))){ score++; addStars(2); burst(); say(PRAISE[r%PRAISE.length]); setTimeout(()=>{r++;q();},1300); q('برافو! نطقك صح','ok'); }
            else q('قربت! اسمع تاني وجرب','no'); };
          rec.onerror=e=>{got=true; q(e.error==='not-allowed'||e.error==='service-not-allowed'?'محتاجين إذن المايك من المتصفح':'مسمعتش كويس، جرب تاني','no');};
          rec.onend=()=>{ if(!got) q('مسمعتش حاجة، جرب تاني','no'); };

/* ---------- state ---------- */
const KEY=profKey(ME);
let st={p:{},next:0,plan:null,streak:0,last:null,slow:false,goal:10,hist:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null'); if(s) st=Object.assign(st,s);}catch(e){}
const save=()=>{st.ts=Date.now(); try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){} if(window.__onSave) window.__onSave(st);};
function touchStreak(){const t=today(); if(st.last===t) return; st.streak=(st.last===t-1)?st.streak+1:1; st.last=t;}
function ensurePlan(){
  const t=today();
  if(!st.plan||st.plan.day!==t){
    const left=st.plan&&st.plan.day!==t?st.plan.queue.filter(i=>!st.p[i]):[];
    const q=left.slice(0,st.goal||PER_DAY);
    while(q.length<(st.goal||PER_DAY)&&st.next<W.length){ if(!st.p[st.next]) q.push(st.next); st.next++; }
    st.plan={day:t,queue:q,done:[]}; save();
  }
}
const dueList=()=>{const t=today();return Object.keys(st.p).map(Number).filter(i=>st.p[i][1]<=t)};
function grade(i,ok){
  const t=today(); const cur=st.p[i]||[0,t];
  if(!st.hist) st.hist={};
  if(ok&&cur[0]===0) st.hist[t]=(st.hist[t]||0)+1;
  if(ok) addPts(cur[0]===0?3:1);
  const box=ok?Math.min(cur[0]+1,INTERVALS.length-1):0;
  st.p[i]=[box,t+(ok?INTERVALS[box]:0)];
  touchStreak(); save();
}

const synth=window.speechSynthesis; let voice=null, voiceGB=null;
function pickVoice(){ if(!synth) return; const vs=synth.getVoices(); const L=v=>(v.lang||'').replace('_','-');
  voice=vs.find(v=>L(v)==='en-US'&&/Samantha|Google US|Aria|Jenny|Ava/i.test(v.name))||vs.find(v=>L(v)==='en-US')||vs.find(v=>/^en/i.test(L(v)))||null;
  voiceGB=vs.find(v=>L(v)==='en-GB'&&/Daniel|Google UK|Sonia|Libby|Serena|Kate/i.test(v.name))||vs.find(v=>L(v)==='en-GB')||null; }
if(synth){ pickVoice(); synth.onvoiceschanged=pickVoice; } else document.getElementById('voiceNote').hidden=false;
function say(text,acc){ if(!synth) return; try{ synth.cancel(); const u=new SpeechSynthesisUtterance(text); const gb=acc==='gb'; u.lang=gb?'en-GB':'en-US'; const v=gb?voiceGB:voice; if(v) u.voice=v; u.rate=st.slow?0.6:0.9; synth.speak(u);}catch(e){} }
const speedBtn=document.getElementById('speed');

/* ---------- quiz ---------- */
let qz=null;
const shuffle=a=>{for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};
function newQuiz(){
  let pool=Object.keys(st.p).map(Number);
  const from=pool.length>=6?'كلماتك المحفوظة':'أول ٦٠ كلمة';
  if(pool.length<6) pool=Array.from({length:60},(_,k)=>k);
  const qs=shuffle(pool.slice()).slice(0,Math.min(10,pool.length)).map(i=>{
    const dir=Math.random()<.5?'en':'ar';
    const same=W.map((_,k)=>k).filter(k=>k!==i&&W[k].part===W[i].part&&W[k].m!==W[i].m&&W[k].w!==W[i].w);
    const opts=shuffle([i,...shuffle(same).slice(0,3)]);
    return {i,dir,opts};
  });
  qz={qs,k:0,score:0,picked:null,from};
}
function renderQuiz(){
  if(!qz) newQuiz();
  if(qz.k>=qz.qs.length){
    view.innerHTML=`<div class="empty"><div class="big">${n(qz.score)} / ${n(qz.qs.length)}</div><h2>${qz.score>=8?'ممتاز':'كويس، كمل تمرين'}</h2>
      <p class="sub">الكلمات اللي غلطت فيها اتضافت لمراجعة النهاردة.</p><button class="btn primary" id="again" type="button">اختبار جديد</button></div>`;
    view.querySelector('#again').onclick=()=>{qz=null;renderQuiz();}; return;
  }
  const q=qz.qs[qz.k]; const w=W[q.i];
  const prompt=q.dir==='en'?`<div class="prompt en" lang="en">${esc(w.w)}</div><div class="center">${accBtns(w.w)}</div><p class="sub">اختار المعنى الصح</p>`
                         :`<div class="prompt">${esc(w.m)}</div><p class="sub">اختار الكلمة الإنجليزي الصح</p>`;
  const opts=q.opts.map(o=>{let cls='opt'+(q.dir==='ar'?' en':''); if(qz.picked!=null){ if(o===q.i) cls+=' right'; else if(o===qz.picked) cls+=' wrong'; }
    return `<button class="${cls}" type="button" data-o="${o}" ${qz.picked!=null?'disabled':''} ${q.dir==='ar'?'lang="en"':''}>${esc(q.dir==='en'?W[o].m:W[o].w)}</button>`}).join('');
  view.innerHTML=`<div class="head"><h2>اختبار</h2><p class="sub">سؤال ${n(qz.k+1)} من ${n(qz.qs.length)} · من ${esc(qz.from)}</p></div>
    <div class="q">${prompt}<div class="opts">${opts}</div>
    ${qz.picked!=null?`<div class="back"><div class="en" style="font-size:1.3rem">${esc(w.w)}</div>${pronBox(w.p,w.b||w.p,w.w)}<div class="mean">${esc(w.m)}</div></div><button class="btn primary" id="nx" type="button">السؤال اللي بعده</button>`:''}</div>`;
  view.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{const o=+b.dataset.o; qz.picked=o; if(o===q.i){qz.score++;} else if(st.p[q.i]){grade(q.i,false);stats();} say(w.w); renderQuiz();});
  const nx=view.querySelector('#nx'); if(nx) nx.onclick=()=>{qz.k++;qz.picked=null;renderQuiz();};
}

function learnedPool(min,fallback){ let p=Object.keys(st.p).map(Number); if(p.length<min) p=Array.from({length:fallback},(_,k)=>k); return p; }
const PHR_SHORT=()=>D.phr.items.filter(x=>!x.en.includes('...')&&x.en.split(' ').length>=3&&x.en.split(' ').length<=8);
function roundDone(score,total,again){

/* ---------- dictation: listen and write ---------- */
let dc=null, dcMode='w';
function newDict(){
  let items;
  if(dcMode==='w'){ items=shuffle(learnedPool(10,150).filter(i=>/^[A-Za-z][A-Za-z ]*$/.test(W[i].w))).slice(0,10).map(i=>({t:W[i].w,p:W[i].p,b:W[i].b||W[i].p,m:W[i].m,i})); }
  else { items=shuffle(PHR_SHORT()).slice(0,10).map(x=>({t:x.en,p:x.p,b:x.b,m:x.m})); }
  dc={items,k:0,score:0,ans:null};
}
function diffHTML(target,typed){
  const a=target.split(' '), b=norm(typed).split(' ');
  return a.map((w,k)=>norm(w)===(b[k]||'')?esc(w):`<span class="x">${esc(w)}</span>`).join(' ');
}
function renderDictation(){
  if(!dc) newDict();
  if(dc.k>=dc.items.length) return roundDone(dc.score,dc.items.length,()=>{dc=null;renderDictation();});
  const it=dc.items[dc.k]; const done=dc.ans!=null; const ok=done&&norm(dc.ans)===norm(it.t);
  view.innerHTML=`<div class="head"><h2>اسمع واكتب</h2><p class="sub">اسمع وبعدين اكتب اللي سمعته بالإنجليزي. ده بيقوي الإملاء والحروف الصامتة.</p></div>
  <div class="modes"><button class="fchip" type="button" data-m="w" aria-pressed="${dcMode==='w'}">كلمات</button><button class="fchip" type="button" data-m="s" aria-pressed="${dcMode==='s'}">جمل</button></div>
  <div class="q"><p class="sub">${n(dc.k+1)} من ${n(dc.items.length)}</p>
    <div class="actions"><button class="btn primary" type="button" data-say="${esc(it.t)}">${SPK} اسمع</button><button class="btn ghost" type="button" id="slow">اسمع ببطء</button></div>
    <input class="dict-in ${done?(ok?'ok':'no'):''}" id="dcin" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="اكتب هنا" lang="en" ${done?'disabled':''} value="${esc(dc.ans||'')}">
    ${done?`<div class="verdict ${ok?'ok':'no'}">${ok?'صح':'فيه غلط'}</div>
      <div class="cmp"><div class="row"><small>الصح</small><span class="en">${diffHTML(it.t,dc.ans)}</span></div>
      <div class="row"><small>النطق الأمريكي</small><span>${esc(it.p)}</span></div><div class="row"><small>المعنى</small><span>${esc(it.m)}</span></div></div>
      <button class="btn primary" id="nx" type="button">اللي بعده</button>`
    :`<button class="btn primary" id="chk" type="button">صحح</button>`}
  </div>`;
  view.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{dcMode=b.dataset.m;dc=null;renderDictation();});
  view.querySelector('#slow').onclick=()=>{const s=st.slow; st.slow=true; say(it.t); st.slow=s;};
  if(!done){
    const inp=view.querySelector('#dcin');
    const check=()=>{ if(!inp.value.trim()) {inp.focus();return;} dc.ans=inp.value; if(norm(dc.ans)===norm(it.t)) dc.score++; else if(it.i!=null&&st.p[it.i]){grade(it.i,false);stats();} renderDictation(); };
    view.querySelector('#chk').onclick=check; inp.onkeydown=e=>{if(e.key==='Enter')check();};
    if(dc.k===0&&!dc.played){dc.played=true;}
  } else view.querySelector('#nx').onclick=()=>{dc.k++;dc.ans=null;renderDictation(); setTimeout(()=>say(dc.items[dc.k]&&dc.items[dc.k].t||''),150);};
}

/* ---------- sentence ordering ---------- */
let od=null;
function newOrder(){
  const pool=[...PHR_SHORT().map(x=>({t:x.en,m:x.m})), ...W.filter(w=>w.e&&w.e.split(' ').length>=3&&w.e.split(' ').length<=9).map(w=>({t:w.e,m:w.ea}))];
  const items=shuffle(pool).slice(0,10).map(x=>{const toks=x.t.replace(/[.!?]+$/,'').split(' '); let sh; let g=0; do{sh=shuffle(toks.map((w,k)=>({w,k})));g++;}while(sh.every((o,k)=>o.w===toks[k])&&g<10); return {...x,toks,sh,ans:[],done:false};});
  od={items,k:0,score:0};
}
function renderOrder(){
  if(!od) newOrder();
  if(od.k>=od.items.length) return roundDone(od.score,od.items.length,()=>{od=null;renderOrder();});
  const it=od.items[od.k]; const used=new Set(it.ans);
  const ok=it.done&&it.ans.map(k=>it.sh[k].w).join(' ')===it.toks.join(' ');
  view.innerHTML=`<div class="head"><h2>رتب الجملة</h2><p class="sub">دوس على الكلمات بالترتيب الصح عشان تكوّن الجملة. ودوس على أي كلمة فوق ترجعها.</p></div>
  <div class="q"><p class="sub">${n(od.k+1)} من ${n(od.items.length)}</p><div class="prompt" style="font-size:1.2rem">${esc(it.m)}</div>
    <div class="slot ${it.done?(ok?'ok':'no'):''}" id="slot">${it.ans.map((k,j)=>`<button class="wchip" type="button" data-back="${j}" ${it.done?'disabled':''}>${esc(it.sh[k].w)}</button>`).join('')}</div>
    <div class="pool">${it.sh.map((o,k)=>used.has(k)?'':`<button class="wchip" type="button" data-pick="${k}" ${it.done?'disabled':''}>${esc(o.w)}</button>`).join('')}</div>
    ${it.done?`<div class="verdict ${ok?'ok':'no'}">${ok?'صح':'الترتيب الصح'}</div>${ok?'':`<div class="en" style="font-size:1.1rem">${esc(it.t)}</div>`}<div class="center">${accBtns(it.t)}</div><button class="btn primary" id="nx" type="button">الجملة اللي بعدها</button>`
     :`<div class="actions"><button class="btn ghost" id="clr" type="button">امسح</button><button class="btn primary" id="chk" type="button" ${it.ans.length<it.sh.length?'disabled':''}>صحح</button></div>`}
  </div>`;
  view.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{it.ans.push(+b.dataset.pick);renderOrder();});
  view.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>{it.ans.splice(+b.dataset.back,1);renderOrder();});
  const c=view.querySelector('#clr'); if(c) c.onclick=()=>{it.ans=[];renderOrder();};
  const k=view.querySelector('#chk'); if(k) k.onclick=()=>{it.done=true; if(it.ans.map(x=>it.sh[x].w).join(' ')===it.toks.join(' ')) od.score++; say(it.t); renderOrder();};
  const nx=view.querySelector('#nx'); if(nx) nx.onclick=()=>{od.k++;renderOrder();};
}

/* ---------- speaking with the microphone ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let sp=null, spMode='w', rec=null;
function listen(target,cb){
  if(!SR) return cb({err:'none'});
  try{ rec=new SR(); rec.lang='en-US'; rec.interimResults=false; rec.maxAlternatives=5;
    let got=false;
    rec.onresult=e=>{got=true; cb({alts:Array.from(e.results[0]).map(a=>a.transcript)});};
    rec.onerror=e=>{got=true; cb({err:e.error||'x'});};
    rec.onend=()=>{ if(!got) cb({err:'no-speech'}); rec=null; };
    rec.start();
  }catch(e){ cb({err:'x'}); }
}
function judge(target,alts){
  const t=norm(target); if(alts.some(a=>norm(a)===t)) return {lv:'ok',heard:alts[0]};
  const tw=t.split(' '); let best=0, heard=alts[0]||'';
  alts.forEach(a=>{const aw=new Set(norm(a).split(' ')); const hit=tw.filter(w=>aw.has(w)).length/tw.length; if(hit>best){best=hit;heard=a;}});
  return {lv:best>=0.7?'mid':'no',heard};
}
function newSpeak(){
  const items=spMode==='w'?shuffle(learnedPool(10,100)).slice(0,10).map(i=>({t:W[i].w,p:W[i].p,b:W[i].b||W[i].p,m:W[i].m})):shuffle(PHR_SHORT()).slice(0,10).map(x=>({t:x.en,p:x.p,b:x.b,m:x.m}));
  sp={items,k:0,res:null,busy:false,err:null};
}
const MICERR={'not-allowed':'المايك مش مسموح هنا. التمرين ده هيشتغل لما نرفع التطبيق وتفتحه من كروم وتسمح بالمايك.','service-not-allowed':'المايك مش مسموح هنا. التمرين ده هيشتغل لما نرفع التطبيق وتفتحه من كروم وتسمح بالمايك.','none':'المتصفح ده مبيدعمش التعرف على الصوت. افتح التطبيق من كروم.','no-speech':'مسمعتش حاجة. قرب الموبايل وجرب تاني.','audio-capture':'مفيش مايك شغال على الجهاز ده.','network':'التعرف على الصوت محتاج إنترنت. اتأكد من الاتصال.'};
function renderSpeak(){
  if(!sp) newSpeak();
  const it=sp.items[sp.k]; const r=sp.res;
  view.innerHTML=`<div class="head"><h2>انطق</h2><p class="sub">اسمع النطق، وبعدين دوس على المايك وقول الكلمة بصوت واضح.</p></div>
  <div class="modes"><button class="fchip" type="button" data-m="w" aria-pressed="${spMode==='w'}">كلمات</button><button class="fchip" type="button" data-m="s" aria-pressed="${spMode==='s'}">جمل</button></div>
  <div class="q"><p class="sub">${n(sp.k+1)} من ${n(sp.items.length)}</p>
    <div class="prompt en" lang="en" style="${spMode==='s'?'font-size:1.4rem':''}">${esc(it.t)}</div>
    <div class="sub">${esc(it.m)}</div>
    ${pronBox(it.p,it.b,it.t)}
    <button class="mic ${sp.busy?'on':''}" id="mic" type="button" aria-label="سجل صوتك">${MIC}</button>
    <p class="sub">${sp.busy?'بسمعك دلوقتي...':'دوس على المايك واتكلم'}</p>
    ${sp.err?`<div class="verdict no">${esc(MICERR[sp.err]||'حصلت مشكلة في المايك. جرب تاني.')}</div>`:''}
    ${r?`<div class="verdict ${r.lv}">${r.lv==='ok'?'نطقك صح':r.lv==='mid'?'قريب جدًا، جرب تاني':'مش واضح، اسمع النطق وجرب تاني'}</div><div class="sub">سمعتك بتقول</div><div class="heard">${esc(r.heard||'')}</div>`:''}
    <div class="actions"><button class="btn ghost" id="skip" type="button">اللي بعده</button><button class="btn ghost" id="rep" type="button">جرب تاني</button></div>
  </div>`;
  view.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{spMode=b.dataset.m;sp=null;renderSpeak();});
  view.querySelector('#mic').onclick=()=>{ if(sp.busy) return; if(synth) synth.cancel(); sp.busy=true; sp.err=null; sp.res=null; renderSpeak();
    listen(it.t,res=>{ sp.busy=false; if(res.err) sp.err=res.err; else sp.res=judge(it.t,res.alts); renderSpeak(); }); };
  view.querySelector('#skip').onclick=()=>{ sp.k=(sp.k+1)%sp.items.length; if(sp.k===0) newSpeak(); sp.res=null; sp.err=null; renderSpeak(); };
  view.querySelector('#rep').onclick=()=>{ sp.res=null; sp.err=null; renderSpeak(); };
}

      <div class="os">${q[1].map((o,oi)=>{let c='o'; if(a!=null){ if(oi===q[2]) c+=' right'; else if(oi===a) c+=' wrong'; } return `<button class="${c}" type="button" data-q="${qi}" data-o="${oi}" ${a!=null?'disabled':''}>${esc(o)}</button>`}).join('')}</div>

    const y=window.scrollY; renderLessons(); window.scrollTo(0,y);});

/* ---------- conversations ---------- */
const C=D.con; let convOpen=null, convRole=-1, revealed=new Set(), playing=-1, convRes={};
function sayLine(text,onend){ if(!synth) return onend&&onend(); try{ synth.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang='en-US'; if(voice) u.voice=voice; u.rate=st.slow?0.6:0.9; u.onend=()=>onend&&onend(); u.onerror=()=>onend&&onend(); synth.speak(u);}catch(e){onend&&onend();} }
function renderConvos(){
  if(convOpen==null){
    view.innerHTML=`<div class="head"><h2>محادثات</h2><p class="sub">مواقف من الشغل والحياة اليومية. اسمع المحادثة، وبعدين اختار دورك واتمرن على الرد.</p></div>
    <div class="panel">${C.map((c,k)=>`<button class="lrow" type="button" data-c="${k}"><span class="num">${n(k+1)}</span><span class="tt">${esc(c.t)}</span><span class="sc">${n(c.l.length)} جمل</span></button>`).join('')}</div>`;
    view.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{convOpen=+b.dataset.c;convRole=-1;revealed=new Set();convRes={};renderConvos();window.scrollTo(0,0);});
    return;
  }
  const c=C[convOpen];
  view.innerHTML=`<div class="head"><h2>${esc(c.t)}</h2><p class="sub">${convRole<0?'اقرا واسمع المحادثة. ولما تكون جاهز، اختار دورك.':'جملك مستخبية. اقرا المعنى، وحاول تقولها بالإنجليزي، وبعدين اكشفها أو انطقها في المايك.'}</p></div>
  <div class="modes"><button class="fchip" type="button" data-r="-1" aria-pressed="${convRole<0}">قراءة</button>${c.r.map((r,k)=>`<button class="fchip" type="button" data-r="${k}" aria-pressed="${convRole===k}">أنا ${esc(r)}</button>`).join('')}</div>
  <button class="btn primary" id="playall" type="button">${playing>=0?'وقف':'اسمع المحادثة كلها'}</button>
  <div class="chat">${c.l.map((l,k)=>{const mine=convRole===l[0]; const hide=mine&&!revealed.has(k); const res=convRes[k];
    return `<div class="bub r${l[0]} ${hide?'hide':''} ${playing===k?'playing':''}"><span class="who">${esc(c.r[l[0]])}</span>
      <span class="en">${esc(l[1])}</span><span class="a">${esc(l[2])}</span>
      <span class="us">أمريكي: ${esc(l[3])}</span><span class="uk">بريطاني: ${esc(l[4])}</span>
      <span class="row2">${hide?`<button class="minib" type="button" data-rev="${k}">اكشف الجملة</button>`:accBtns(l[1])}${mine?`<button class="minib" type="button" data-mic="${k}">انطقها</button>`:''}</span>
      ${res?`<div class="verdict ${res.lv||'no'}">${res.err?esc(MICERR[res.err]||'حصلت مشكلة في المايك.'):res.lv==='ok'?'نطقك صح':res.lv==='mid'?'قريب جدًا':'جرب تاني'}</div>`:''}</div>`}).join('')}</div>
  <div class="actions"><button class="btn ghost" id="cback" type="button">كل المحادثات</button>${convOpen<C.length-1?`<button class="btn primary" id="cnext" type="button">المحادثة اللي بعدها</button>`:''}</div>`;
  view.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{convRole=+b.dataset.r;revealed=new Set();convRes={};renderConvos();});
  view.querySelectorAll('[data-rev]').forEach(b=>b.onclick=()=>{const k=+b.dataset.rev; revealed.add(k); say(c.l[k][1]); renderConvos();});
  view.querySelectorAll('[data-mic]').forEach(b=>b.onclick=()=>{const k=+b.dataset.mic; b.textContent='بسمعك...'; listen(c.l[k][1],res=>{convRes[k]=res.err?{err:res.err}:judge(c.l[k][1],res.alts); if(!res.err) revealed.add(k); renderConvos();});});
  view.querySelector('#playall').onclick=()=>{ if(playing>=0){playing=-1; if(synth) synth.cancel(); renderConvos(); return;}
    const step=k=>{ if(playing<0||convOpen==null) return; if(k>=c.l.length){playing=-1;renderConvos();return;} playing=k; renderConvos(); sayLine(c.l[k][1],()=>setTimeout(()=>{ if(playing===k) step(k+1); },350)); };
    playing=0; step(0); };
  view.querySelector('#cback').onclick=()=>{convOpen=null;playing=-1;if(synth)synth.cancel();renderConvos();};
  const nx=view.querySelector('#cnext'); if(nx) nx.onclick=()=>{convOpen++;convRole=-1;revealed=new Set();convRes={};playing=-1;renderConvos();window.scrollTo(0,0);};
}

/* ---------- weekly points ---------- */
const wk=()=>Math.floor((today()-3)/7);
function addPts(k){ if(!st.pts||st.pts.wk!==wk()) st.pts={wk:wk(),v:0}; st.pts.v+=k; }
const weekPts=()=>st.pts&&st.pts.wk===wk()?st.pts.v:0;

/* ---------- word lookup ---------- */
const WIDX={}; W.forEach((w,i)=>{const k=w.w.toLowerCase(); if(!(k in WIDX)) WIDX[k]=i;});
const IRR={been:'be',went:'go',gone:'go',ate:'eat',eaten:'eat',took:'take',taken:'take',came:'come',made:'make',said:'say',felt:'feel',met:'meet',built:'build',swam:'swim',brought:'bring',told:'tell',had:'have',has:'have',found:'find',sent:'send',thought:'think',got:'get',children:'child',men:'man',women:'woman',was:'be',were:'be',is:'be',are:'be',am:'be',did:'do',does:'do',saw:'see',seen:'see',gave:'give',given:'give',left:'leave',kept:'keep',slept:'sleep',bought:'buy',spent:'spend',began:'begin',knew:'know',known:'know',wrote:'write',written:'write',drove:'drive',ran:'run',sat:'sit',stood:'stand',understood:'understand',paid:'pay',heard:'hear',lost:'lose',taught:'teach',caught:'catch',chose:'choose',spoke:'speak',woke:'wake',became:'become',better:'good',best:'good',worse:'bad',worst:'bad'};
function lookup(t){
  let w=t.toLowerCase().replace(/'s$|’s$/,'').replace(/n't$/,''); if(w in WIDX) return WIDX[w];
  if(IRR[w]&&IRR[w] in WIDX) return WIDX[IRR[w]];
  const tries=[];
  if(w.endsWith('ies')) tries.push(w.slice(0,-3)+'y'); if(w.endsWith('ied')) tries.push(w.slice(0,-3)+'y');
  if(w.endsWith('es')) tries.push(w.slice(0,-2)); if(w.endsWith('s')) tries.push(w.slice(0,-1));
  if(w.endsWith('ed')){ tries.push(w.slice(0,-2),w.slice(0,-1)); if(w[w.length-3]===w[w.length-4]) tries.push(w.slice(0,-3)); }
  if(w.endsWith('ing')){ tries.push(w.slice(0,-3),w.slice(0,-3)+'e'); if(w[w.length-4]===w[w.length-5]) tries.push(w.slice(0,-4)); }
  if(w.endsWith('ly')) tries.push(w.slice(0,-2)); if(w.endsWith('ily')) tries.push(w.slice(0,-3)+'y');
  if(w.endsWith('er')) tries.push(w.slice(0,-2),w.slice(0,-1)); if(w.endsWith('est')) tries.push(w.slice(0,-3));
  for(const x of tries) if(x in WIDX) return WIDX[x];
  return -1;
}
function wordPop(t){
  const i=lookup(t); let el=document.getElementById('wpop'); if(!el){el=document.createElement('div');el.id='wpop';el.className='wpop';el.dir='rtl';document.body.appendChild(el);}
  const close=()=>el.remove();
  if(i<0){ el.innerHTML=`<div class="in"><b class="en">${esc(t)}</b><p class="sub">الكلمة دي مش في القاموس.</p><div class="actions"><button class="btn ghost" type="button" data-say="${esc(t)}">${SPK}اسمع</button><button class="btn primary" type="button" id="wpx">تمام</button></div></div>`; }
  else { const w=W[i], has=!!st.p[i];
    el.innerHTML=`<div class="in"><b class="en">${esc(w.w)}</b><span class="mean">${esc(w.m)}</span>
      <span class="pp">أمريكي: ${esc(w.p)}</span><span class="pp gb">بريطاني: ${esc(w.b||w.p)}</span>
      <div class="actions"><button class="btn ghost" type="button" data-say="${esc(w.w)}">${SPK}اسمع</button><button class="btn ${has?'ghost':'primary'}" type="button" id="wpadd" ${has?'disabled':''}>${has?'موجودة في مراجعتك':'ضيفها للمراجعة'}</button></div>
      <button class="btn ghost wide" type="button" id="wpx">قفل</button></div>`;
    const a=el.querySelector('#wpadd'); if(!has) a.onclick=()=>{ st.p[i]=[0,today()]; save(); stats(); a.textContent='اتضافت ✓'; a.disabled=true; a.className='btn ghost'; };
  }
  el.querySelector('#wpx').onclick=close; el.onclick=e=>{ if(e.target===el) close(); const b=e.target.closest('[data-say]'); if(b) say(b.dataset.say); };
  say(i<0?t:W[i].w);
}

const LVNAME=['مبتدئ','فوق المبتدئ','متوسط','فوق المتوسط','متقدم'];
let pt=null;
function newTest(){
  const qs=[];
  BANDS.forEach(([a,b],bi)=>{ const pool=shuffle(Array.from({length:b-a},(_,k)=>a+k).filter(i=>!W[i].w.includes(' '))); const picked=[];
    for(const i of pool){ if(picked.length>=4) break; if(!picked.some(j=>W[j].m===W[i].m)) picked.push(i); }
    picked.forEach(i=>{ const others=shuffle(pool.filter(j=>j!==i&&W[j].m!==W[i].m)).slice(0,3); qs.push({t:'v',band:bi,i,opts:shuffle([i,...others])}); }); });
  [0,2,4,6,8,10].forEach(li=>{ const L0=D.les[li]; const q=L0.q[Math.floor(Math.random()*L0.q.length)]; qs.push({t:'g',li,q}); });

  const w=Math.floor((today()-3)/7), pts=o.pts&&o.pts.wk===w?o.pts.v:0;
  if(p.type==='adult'){ const P=o.p||{}; const learned=Object.values(P).filter(v=>v[0]>0).length, master=Object.values(P).filter(v=>v[0]>=4).length;
    return {kid:false,learned,master,started:Object.keys(P).length,streak:o.last!=null&&o.last>=today()-1?o.streak||0:0,les:Object.keys(o.les||{}).length,sto:Object.keys(o.sto||{}).length,lv:o.placed?LVNAME[o.placed.lv]:null,pts,ts:o.ts||0}; }
  return {kid:true,stars:o.stars||0,badges:Object.keys(o.badges||{}).length,seen:Object.values(o.seen||{}).reduce((a,x)=>a+x.length,0),pts,ts:o.ts||0};
}

    if(acct) acct.onclick=()=>{
      const u=auth.currentUser;
      if(u){ if(acct.dataset.confirm==='1'){ auth.signOut(); acct.dataset.confirm=''; } else { acct.dataset.confirm='1'; acct.textContent='دوس تاني للخروج'; setTimeout(()=>{acct.dataset.confirm=''; if(auth.currentUser) acct.textContent='متزامن ✓';},3000); } return; }
      signIn();
    };
  }).catch(()=>{ if(acct) acct.hidden=true; });
})();
</script>

</body></html>
