<div id="installBar" class="subbar" dir="rtl" hidden style="position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:6;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;max-width:528px;margin:0 auto">
  <span id="installTxt">ثبّت التطبيق على شاشتك الرئيسية</span><span class="row2"><button id="installBtn" type="button">ثبّت</button><button id="installX" type="button" aria-label="إغلاق">×</button></span>
</div>
<script>
/* PWA: offline + install */
if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
(function(){
  const bar=document.getElementById('installBar'), btn=document.getElementById('installBtn'), txt=document.getElementById('installTxt');
  let dismissed=false; try{dismissed=localStorage.getItem('atallam-install-x')==='1'}catch(e){}
  const standalone=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone;
  let ev=null;
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault(); ev=e; if(!dismissed&&!standalone) bar.hidden=false;});
  btn.onclick=async()=>{ if(ev){ ev.prompt(); await ev.userChoice; ev=null; bar.hidden=true; } };
  document.getElementById('installX').onclick=()=>{bar.hidden=true; try{localStorage.setItem('atallam-install-x','1')}catch(e){}};
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  if(ios&&!standalone&&!dismissed){ txt.textContent='للتثبيت: دوس على زرار المشاركة وبعدين إضافة للشاشة الرئيسية'; btn.hidden=true; bar.hidden=false; }
})();

/* Account sync + friends board with Firebase */
const FIREBASE_CONFIG = __FIREBASE_CONFIG__;
(function(){
  if(!FIREBASE_CONFIG) return;
  const V='10.12.2', base='https://www.gstatic.com/firebasejs/'+V+'/';
  const load=src=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s);});
  const acct=document.getElementById('acct'); if(acct){acct.hidden=false; acct.textContent='سجّل دخول';}
  const PK='eng-profiles', GK='eng-group';
  const lsGet=k=>{try{return localStorage.getItem(k);}catch(e){return null;}};
  const lsSetRaw=(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}};
  const profiles=()=>{try{const p=JSON.parse(lsGet(PK)||'null'); return Array.isArray(p)&&p.length?p:[{id:'me',name:'أنا',type:'adult',av:'🧑'}];}catch(e){return [{id:'me',name:'أنا',type:'adult',av:'🧑'}];}};
  const keyOf=p=>p.type==='adult'?(p.id==='me'?'eng-cards-v1':'eng-cards-v1:'+p.id):'eng-kid:'+p.id;
  const tsOf=v=>{try{return (JSON.parse(v)||{}).ts||0;}catch(e){return 0;}};
  const wk=()=>{const d=new Date();return Math.floor((Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/86400000)-3)/7);};
  load(base+'firebase-app-compat.js').then(()=>Promise.all([load(base+'firebase-auth-compat.js'),load(base+'firebase-firestore-compat.js')])).then(()=>{
    firebase.initializeApp(FIREBASE_CONFIG);
    const auth=firebase.auth(), db=firebase.firestore();
    let timer=null, ready=false;
    const snapshot=()=>{ const ps=profiles(); return {profiles:ps, data:ps.map(p=>({k:keyOf(p),v:lsGet(keyOf(p))||''})).filter(x=>x.v), ts:Date.now()}; };
    const publish=()=>{ const u=auth.currentUser, g=JSON.parse(lsGet(GK)||'null'); if(!u||!g) return Promise.resolve();
      const w=wk(); return Promise.all(profiles().map(p=>{ let pts=0; try{const o=JSON.parse(lsGet(keyOf(p))||'{}'); if(o.pts&&o.pts.wk===w) pts=o.pts.v;}catch(e){}
        return db.collection('board').doc(u.uid+'_'+p.id).set({uid:u.uid,name:p.name,av:p.av,group:g,wk:w,pts,ts:Date.now()}); })).catch(()=>{}); };
    const push=()=>{ const u=auth.currentUser; if(!u||!ready) return; clearTimeout(timer); timer=setTimeout(()=>{
      db.collection('users').doc(u.uid).set(Object.assign(snapshot(),{name:u.displayName||''})).catch(()=>{}); publish(); },1500); };
    window.__onSave=push; window.__onKidSave=push; window.__onProfiles=push;
    const signIn=()=>{ const p=new firebase.auth.GoogleAuthProvider(); auth.signInWithPopup(p).catch(e=>{ if(e&&e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request') auth.signInWithRedirect(p); }); };
    window.__board={ user:()=>auth.currentUser, signIn, publish,
      load:(g,w)=>db.collection('board').where('group','==',g).where('wk','==',w).get().then(q=>q.docs.map(d=>d.data())),
      leave:()=>{ const u=auth.currentUser; if(!u) return; profiles().forEach(p=>db.collection('board').doc(u.uid+'_'+p.id).delete().catch(()=>{})); } };
    auth.getRedirectResult().catch(()=>{});
    auth.onAuthStateChanged(async u=>{
      if(acct) acct.textContent=u?'متزامن ✓':'سجّل دخول';
      if(window.__onAuth) setTimeout(()=>window.__onAuth(u),0);
      ready=false; if(!u) return;
      try{
        const d=await db.collection('users').doc(u.uid).get(); let changed=false;
        if(d.exists){ const r=d.data();
          let data=r.data||[]; if(!r.data&&r.st) data=[{k:'eng-cards-v1',v:JSON.stringify(r.st)}];
          if(Array.isArray(r.profiles)){ const loc=profiles(); const ids=new Set(loc.map(p=>p.id)); const add=r.profiles.filter(p=>!ids.has(p.id));
            if(add.length||!lsGet(PK)){ lsSetRaw(PK,JSON.stringify(loc.concat(add))); changed=changed||add.length>0; } }
          data.forEach(x=>{ const loc=lsGet(x.k); if(x.v&&tsOf(x.v)>tsOf(loc)){ lsSetRaw(x.k,x.v); changed=true; } });
        }
        ready=true;
        if(changed){ try{ if(sessionStorage.getItem('eng-sync-reload')!=='1'){ sessionStorage.setItem('eng-sync-reload','1'); location.reload(); return; } }catch(e){} }
        try{sessionStorage.removeItem('eng-sync-reload');}catch(e){}
        push();
      }catch(e){ ready=true; }
    });
    if(acct) acct.onclick=()=>{
      const u=auth.currentUser;
      if(u){ if(acct.dataset.confirm==='1'){ auth.signOut(); acct.dataset.confirm=''; } else { acct.dataset.confirm='1'; acct.textContent='دوس تاني للخروج'; setTimeout(()=>{acct.dataset.confirm=''; if(auth.currentUser) acct.textContent='متزامن ✓';},3000); } return; }
      signIn();
    };
  }).catch(()=>{ if(acct) acct.hidden=true; });
})();
</script>
